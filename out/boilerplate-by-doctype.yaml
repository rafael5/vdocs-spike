    enter discharge summaries. in addition, cprs supports clinical decision-making and enables you to
    review and analyze patient data.
  text: The Computerized Patient Record System (CPRS) is a Veterans Health Information Systems and Technology
    Architecture (VistA) suite of application packages. CPRS enables you to enter, review, and continuously
