  key: per the veteran-focused integrated process (vip) guide, the user’s guide is required to be completed
    prior to critical decision point \#2 (cd2), with the expectation that it will be updated as needed.
    a user guide is a technical communication document intended to give assistance to people using a particular
    system, such as vista end users. it is usually written by a technical writer, although it can also
    be written by programmers, product or project managers, or other technical staff. most user guides
    contain both a written guide and the associated images. in the case of computer applications, it is
    usual to include screenshots of the human-machine interfaces, and hardware manuals often include clear,
    simplified diagrams. the language used is matched to the intended audience, with jargon kept to a
    minimum or explained thoroughly. the user guide is a mandatory, build-level document, and should be
    updated to reflect the contents of the most recently deployed build. the sections documented herein
    are required if applicable to your product.
  text: Per the Veteran-focused Integrated Process (VIP) Guide, the User’s Guide is required to be completed
