  label: For example, suppose your facility has a release e
  key: for example, suppose your facility has a release event named “transfer to surgery icu” that releases
    orders when a patient is transferred to the surgery icu. this release event is appropriate for most
    of your needs; however, when a clinician writes delayed orders for a transfer to the orthopedic surgery
    icu, you would like the clinician to be presented with a slightly different order menu. in this example,
    you could create a child release event called “transfer to orthopedic surgery icu”. this child event
    would share the same trigger event as its parent; however, clinicians who selected the “transfer to
    orthopedic surgery icu” child release event would be presented with a different order menu.
  text: For example, suppose your facility has a release event named “transfer to surgery ICU” that releases
    orders when a patient is transferred to the surgery ICU. This release event is appropriate for most
    of your needs; however, when a clinician writes delayed orders for a transfer to the orthopedic surgery
    ICU, you would like the clinician to be presented with a slightly different order menu. In this example,
    you could create a child release event called “transfer to orthopedic surgery ICU”. This child event
    would share the same trigger event as its parent; however, clinicians who selected the “transfer to
    orthopedic surgery ICU” child release event would be presented with a different order menu.
