- id: bp-08f0ff85d8
  label: A JAAS-compliant login module contains all of the
  key: a jaas-compliant login module contains all of the logic required to authenticate a user to a given
    system. the login module class does not itself, however, include the user interface to gather authentication
    credentials (e.g., access and verify codes) from the end-user. instead, a set of jaas-compliant callbacks,
    along with a jaas-compliant callback handler, are used to de-couple the user interface from the login
    module. vistalink provides a jaas-compatible login module and jaas-compliant callbacks and callback
    handlers to perform a vista login.
  text: A JAAS-compliant login module contains all of the logic required to authenticate a user to a given
    system. The login module class does not itself, however, include the user interface to gather authentication
    credentials (e.g., access and verify codes) from the end-user. Instead, a set of JAAS-compliant callbacks,
    along with a JAAS-compliant callback handler, are used to de-couple the user interface from the login
    module. VistALink provides a JAAS-compatible login module and JAAS-compliant callbacks and callback
    handlers to perform a VistA login.
  evidence_docs: 3
  doc_type: DG
- id: bp-09414f023b
  label: The second parameter is useful if the text is to b
  key: the second parameter is useful if the text is to be passed in a cdata section of an xml message.
    if this parameter is set to true, the returned encoded strings will contain neither "\]\]\>" nor "\<\![cdata\[".
    otherwise, it is possible a returned encoding may contain those character sequences. if, in a reasonable
    number of tries, an encoded string cannot be created without these cdata boundaries, an exception
    is thrown of type vistakernelhashcountlimitexceededexception.
