- id: bp-f784f4927b
  label: The classification system consists of more than 68
  key: the classification system consists of more than 68,000 codes, compared to approximately 13,000
    icd-9-cm codes. there are nearly 87,000 icd-10-pcs codes, while icd-9-cm has nearly 3,800 procedure
    codes. both systems also expand the number of characters allotted from five and four respectively
    to seven alpha-numeric characters. this value does not include the decimal point, which follows the
    third character for the icd-10-cm code set. there is no decimal point in the icd-10-pcs code set.
    these code sets have the potential to reveal more about quality of care, so that data can be used
    in a more meaningful way to better understand complications, better design clinically robust algorithms,
    and better track the outcomes of care. icd-10-cm also incorporates greater specificity and clinical
    detail to provide information for clinical decision making and outcomes research.
  text: The classification system consists of more than 68,000 codes, compared to approximately 13,000
    ICD-9-CM codes. There are nearly 87,000 ICD-10-PCS codes, while ICD-9-CM has nearly 3,800 procedure
    codes. Both systems also expand the number of characters allotted from five and four respectively
    to seven alpha-numeric characters. This value does not include the decimal point, which follows the
    third character for the ICD-10-CM code set. There is no decimal point in the ICD-10-PCS code set.
    These code sets have the potential to reveal more about quality of care, so that data can be used
    in a more meaningful way to better understand complications, better design clinically robust algorithms,
    and better track the outcomes of care. ICD-10-CM also incorporates greater specificity and clinical
    detail to provide information for clinical decision making and outcomes research.
  evidence_docs: 4
  doc_type: RN
