- id: bp-03273e7606
  label: '> Note**:** This API has defined one entry point b'
  key: '> note**:** this api has defined one entry point by parameter passing, to return data from available
    data nodes from the prescription file (#52). the variable “node” shall be passed null or as a string
    of data separated by commas. every field from the prescription file (#52) shall not be returned, though
    the string must be defined to contain some or all of the following: 0, 2, 3, r, i, p, o, <span id="cprs"
    class="anchor"></span>t, l, s, m, c, a, icd, cprs,st. each section describes what is returned by each
    string variable. trade name field (#6.5) (piece 1 of the “tn” node), from the prescription file (#52)
    that is associated with drug name field (#6) will be returned as part of the 0 node data, if populated.
    the status and “b” cross-reference of **<u>valid</u>** prescriptions is always returned. > > 0 - returns
    the zero node > > 2 - returns the zero and two nodes'
  text: '> Note**:** This API has defined one entry point by parameter passing, to return data from available
    data nodes from the PRESCRIPTION file (#52). The variable “NODE” shall be passed null or as a string
    of data separated by commas. Every field from the PRESCRIPTION file (#52) shall not be returned, though
    the string must be defined to contain some or all of the following: 0, 2, 3, R, I, P, O, <span id="CPRS"
    class="anchor"></span>T, L, S, M, C, A, ICD, CPRS,ST. Each section describes what is returned by each
    string variable. TRADE NAME field (#6.5) (piece 1 of the “TN” node), from the PRESCRIPTION file (#52)
    that is associated with DRUG NAME field (#6) will be returned as part of the 0 node data, if populated.
    The status and “B” cross-reference of **<u>valid</u>** prescriptions is always returned.

    >

    > 0 - returns the Zero node

    >

    > 2 - returns the Zero and Two nodes'
  evidence_docs: 4
  doc_type: API
