- id: bp-42925430f6
  label: Concurrency errors may be encountered by users att
  key: concurrency errors may be encountered by users attempting to update a case or other business records
    at the same time as another user. this is an extremely rare occurrence due to the way cases are assigned
    to users, and to the fact that the user base is relatively small. if this does occur, the first user
    will take precedence and the second user will be notified that any changes made during the session
    will not be written to the database. this type of optimistic locking assumes low likelihood of occurrence
    and will prevent inadvertent corruption of data.
  text: Concurrency errors may be encountered by users attempting to update a case or other business records
    at the same time as another user. This is an extremely rare occurrence due to the way cases are assigned
    to users, and to the fact that the user base is relatively small. If this does occur, the first user
    will take precedence and the second user will be notified that any changes made during the session
    will not be written to the database. This type of optimistic locking assumes low likelihood of occurrence
    and will prevent inadvertent corruption of data.
  evidence_docs: 3
